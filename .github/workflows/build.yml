name: Build Meduza issues

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EPUB issues
        run: |
          python build.py --out docs \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Commit
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Новые выпуски $(date -u +%F\ %H:%M)"
          git push
